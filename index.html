<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StudySphere</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Poppins', 'sans-serif'],
            },
            colors: {
              background: 'hsl(var(--background))',
              foreground: 'hsl(var(--foreground))',
              card: 'hsl(var(--card))',
              'card-foreground': 'hsl(var(--card-foreground))',
              popover: 'hsl(var(--popover))',
              'popover-foreground': 'hsl(var(--popover-foreground))',
              primary: 'hsl(var(--primary))',
              'primary-foreground': 'hsl(var(--primary-foreground))',
              secondary: 'hsl(var(--secondary))',
              'secondary-foreground': 'hsl(var(--secondary-foreground))',
              muted: 'hsl(var(--muted))',
              'muted-foreground': 'hsl(var(--muted-foreground))',
              accent: 'hsl(var(--accent))',
              'accent-foreground': 'hsl(var(--accent-foreground))',
              destructive: 'hsl(var(--destructive))',
              'destructive-foreground': 'hsl(var(--destructive-foreground))',
              border: 'hsl(var(--border))',
              input: 'hsl(var(--input))',
              ring: 'hsl(var(--ring))',
            },
            borderRadius: {
              lg: `0.75rem`,
              md: `calc(0.75rem - 2px)`,
              sm: `calc(0.75rem - 4px)`,
            },
            boxShadow: {
                'primary-glow': '0 0 15px 0 hsl(var(--primary) / 0.5)',
            }
          },
        }
      }
    </script>
    <style>
      :root {
        --background: 224 71% 4%;
        --background-glow-1: 260 90% 30%;
        --background-glow-2: 240 50% 15%;
        --foreground: 210 40% 98%;
        --card-glass: 224 71% 9%; /* Slightly lighter for the glass effect */
        --card: 224 71% 6%;
        --card-foreground: 210 40% 98%;
        --popover: 222.2 84% 4.9%;
        --popover-foreground: 210 40% 98%;
        --primary: 260 85% 75%;
        --primary-foreground: 222.2 47.4% 11.2%;
        --secondary: 217.2 32.6% 12%;
        --secondary-foreground: 210 40% 98%;
        --muted: 217.2 32.6% 17.5%;
        --muted-foreground: 215 20.2% 65.1%;
        --accent: 217.2 32.6% 17.5%;
        --accent-foreground: 210 40% 98%;
        --destructive: 0 62.8% 30.6%;
        --destructive-foreground: 210 40% 98%;
        --border: 217.2 32.6% 14%;
        --input: 217.2 32.6% 12%;
        --ring: 260 85% 75%;
      }
      body {
        background-color: hsl(var(--background));
        background-image: radial-gradient(circle at top left, hsl(var(--background-glow-1) / 0.15) 0%, transparent 35%),
                          radial-gradient(circle at bottom right, hsl(var(--background-glow-2) / 0.1) 0%, transparent 40%);
        background-attachment: fixed;
      }
       /* Glassmorphism class */
      .glass-card {
        background-color: hsl(var(--card-glass) / 0.5);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid hsl(var(--border));
      }
      .form-input {
        background-color: hsl(var(--input));
        border: 1px solid hsl(var(--border));
        border-radius: 0.5rem;
        transition: all 0.2s ease-in-out;
      }
      .form-input:focus {
        outline: none;
        box-shadow: 0 0 0 2px hsl(var(--background)), 0 0 0 4px hsl(var(--ring));
      }
      .primary-btn {
        background-color: hsl(var(--primary));
        color: hsl(var(--primary-foreground));
        border-radius: 0.5rem;
        font-weight: 600;
        transition: all 0.2s ease-in-out;
      }
      .primary-btn:hover {
        opacity: 0.9;
        box-shadow: var(--tw-shadow-primary-glow);
      }
      .secondary-btn {
        background-color: hsl(var(--secondary));
        color: hsl(var(--secondary-foreground));
        border-radius: 0.5rem;
        font-weight: 500;
        transition: background-color 0.2s ease-in-out;
      }
      .secondary-btn:hover {
        background-color: hsl(var(--muted));
      }
      .tag-btn {
        background-color: hsl(var(--secondary));
        border-radius: 9999px;
        transition: all 0.2s ease-in-out;
        border: 1px solid transparent;
      }
      .tag-btn:hover {
        border-color: hsl(var(--primary) / 0.5);
        color: hsl(var(--foreground));
      }
      .tag-btn-active {
        background-color: hsl(var(--primary));
        color: hsl(var(--primary-foreground));
        font-weight: 500;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.25.0",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "firebase/app": "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js",
    "firebase/auth": "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js",
    "firebase/firestore": "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js",
    "firebase/analytics": "https://www.gstatic.com/firebasejs/10.12.2/firebase-analytics.js",
    "firebase/": "https://aistudiocdn.com/firebase@^12.4.0/"
  }
}
</script>
</head>
  <body class="bg-background text-foreground font-['Poppins',_sans-serif]">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
